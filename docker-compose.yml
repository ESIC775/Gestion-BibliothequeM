services:
  db:
    image: mysql:8.0
    container_name: library-db
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_ROOT_PASSWORD: Youssouf2000
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pYoussouf2000",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  api:
    build: .
    container_name: library-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: library_db
      DB_USER: root
      DB_PASSWORD: Youssouf2000
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-secret_key_2026}
      # Inscription réservée à ces domaines d'email (ex : etu.univ-lyon1.fr). Vide = inscription libre.
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./library-frontend
    container_name: library-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

  db-seed:
    image: mysql:8.0
    container_name: library-db-seed
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./db/seed.sql:/seed/seed.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until mysql -h db -u root -pYoussouf2000 library_db -N -e \"SELECT (SELECT COUNT(*) FROM users)+(SELECT COUNT(*) FROM member_profiles)+(SELECT COUNT(*) FROM authors)+(SELECT COUNT(*) FROM categories)+(SELECT COUNT(*) FROM books)+(SELECT COUNT(*) FROM book_authors)+(SELECT COUNT(*) FROM loans)+(SELECT COUNT(*) FROM reservations)\" > /dev/null 2>&1; do echo 'Attente création des tables...'; sleep 2; done;
      COUNT=$$(mysql -h db -u root -pYoussouf2000 library_db -N -e 'SELECT COUNT(*) FROM users' 2>/dev/null);
      if [ \"$$COUNT\" != \"0\" ] && [ -z \"$$FORCE_SEED\" ]; then
        echo 'Base déjà initialisée : seed ignoré (FORCE_SEED=1 pour tout réinitialiser).';
        exit 0;
      fi;
      echo 'Injection du jeu de données...';
      mysql -h db -u root -pYoussouf2000 --default-character-set=utf8mb4 library_db < /seed/seed.sql;
      echo 'Seed terminé.'"
    restart: "no"

volumes:
  mysql_data:
